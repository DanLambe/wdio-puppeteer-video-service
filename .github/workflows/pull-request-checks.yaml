name: Pull Request Checks

on:
  pull_request:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install Dependencies Without Scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify npm Signatures
        run: corepack npm audit signatures

      - name: Run Lint
        run: corepack npm run lint

      - name: Run Typecheck
        run: corepack npm run typecheck

      - name: Run Unit Tests
        run: corepack npm run test:coverage

      - name: Run SonarQube PR Analysis
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Check Packed Package
        run: corepack npm run package:check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install Dependencies Without Scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify npm Signatures
        run: corepack npm audit signatures

      - name: Rebuild E2E Binary Dependencies
        run: corepack npm rebuild esbuild ffmpeg-static edgedriver geckodriver

      - name: Run E2E Tests
        run: corepack npm run test:e2e:both && corepack npm run test:e2e:frameworks && corepack npm run test:e2e:advanced

      - name: Verify Retained Media Dimensions
        run: corepack npm run test:e2e:capture:metadata
