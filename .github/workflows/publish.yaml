name: Publish To NPM

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm (false = validation only)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_name: ${{ steps.package_meta.outputs.name }}
      package_version: ${{ steps.package_meta.outputs.version }}
      should_publish: ${{ steps.npm_check.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0

      - name: Install Dependencies Without Scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify npm Signatures
        run: corepack npm audit signatures

      - name: Read Package Metadata
        id: package_meta
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "name=$package_name" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Check npm For Existing Version
        id: npm_check
        shell: bash
        run: |
          package_name="${{ steps.package_meta.outputs.name }}"
          package_version="${{ steps.package_meta.outputs.version }}"

          if npm view "$package_name@$package_version" version > /dev/null 2>&1; then
            echo "Package $package_name@$package_version is already published."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package $package_name@$package_version is not published yet."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Release Checks
        run: corepack npm run release:check

  pack:
    needs: verify
    runs-on: ubuntu-latest
    if: needs.verify.outputs.should_publish == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish == true)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0

      - name: Install Dependencies Without Scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify npm Signatures
        run: corepack npm audit signatures

      - name: Build Package
        run: corepack npm run clean && corepack npm run build

      - name: Pack npm Artifact
        run: corepack npm pack --ignore-scripts --allow-directory=all

      - name: Generate Release Notes
        shell: bash
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)"
          commit_range="HEAD"
          if [ -n "$latest_tag" ]; then
            commit_range="${latest_tag}..HEAD"
          fi

          ./node_modules/.bin/tsx scripts/generate-release-notes.ts "${{ needs.verify.outputs.package_version }}" "$commit_range" > release-notes.md

      - name: Upload npm Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

      - name: Upload Release Notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs:
      - verify
      - pack
    runs-on: ubuntu-latest
    if: needs.verify.outputs.should_publish == 'true' && github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.publish == true)
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js For npm Publish
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.18.0
          registry-url: 'https://registry.npmjs.org'

      - name: Download npm Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package

      - name: Log Publish Target
        run: echo "Publishing ${{ needs.verify.outputs.package_name }}@${{ needs.verify.outputs.package_version }} to npm"

      - name: Publish To npm
        run: corepack npm publish ./*.tgz --access public --provenance --allow-file=all

  github_release:
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    if: needs.publish.result == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download Release Notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-notes

      - name: Create Git Tag
        shell: bash
        run: |
          release_tag="v${{ needs.verify.outputs.package_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" > /dev/null 2>&1; then
            echo "Tag $release_tag already exists on origin. Skipping tag creation."
            exit 0
          fi

          git tag -a "$release_tag" -m "Release $release_tag"
          git push origin "$release_tag"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.verify.outputs.package_version }}
          name: v${{ needs.verify.outputs.package_version }}
          body_path: release-notes.md
