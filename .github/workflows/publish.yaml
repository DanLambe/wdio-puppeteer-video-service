name: Publish To npm

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: npm release channel permitted for this version
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
      validation_run_1:
        description: First successful Release Candidate Validation run ID
        required: true
        type: string
      validation_run_2:
        description: Second successful Release Candidate Validation run ID
        required: true
        type: string

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-and-pack:
    runs-on: ubuntu-latest
    outputs:
      package_name: ${{ steps.package_meta.outputs.name }}
      package_version: ${{ steps.package_meta.outputs.version }}
      release_dist_tag: ${{ steps.release_channel.outputs.dist_tag }}
    steps:
      - name: Require master
        if: github.ref != 'refs/heads/master'
        run: |
          echo 'Releases must be dispatched from master.' >&2
          exit 1

      - name: Validate Independent RC Runs
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_RUN_1: ${{ inputs.validation_run_1 }}
          VALIDATION_RUN_2: ${{ inputs.validation_run_2 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VALIDATION_RUN_1" == "$VALIDATION_RUN_2" ]]; then
            echo 'Two distinct validation run IDs are required.' >&2
            exit 1
          fi

          expected_workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-validation.yaml" --jq '.id')"
          for run_id in "$VALIDATION_RUN_1" "$VALIDATION_RUN_2"; do
            run_data="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.workflow_id, .event, .head_sha, .head_branch, .conclusion] | @tsv')"
            IFS=$'\t' read -r workflow_id event head_sha head_branch conclusion <<< "$run_data"
            if [[ "$workflow_id" != "$expected_workflow_id" || "$event" != 'workflow_dispatch' ]]; then
              echo "Run $run_id is not a dispatched Release Candidate Validation run." >&2
              exit 1
            fi
            if [[ "$head_sha" != "$GITHUB_SHA" || "$head_branch" != 'master' || "$conclusion" != 'success' ]]; then
              echo "Run $run_id must pass against commit $GITHUB_SHA on master." >&2
              exit 1
            fi
          done

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install Dependencies Without Scripts
        run: corepack npm ci --ignore-scripts

      - name: Verify npm Signatures
        run: corepack npm audit signatures

      - name: Run Release Checks
        run: corepack npm run release:check

      - name: Read Package Metadata
        id: package_meta
        shell: bash
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Validate Release Channel
        id: release_channel
        env:
          PACKAGE_VERSION: ${{ steps.package_meta.outputs.version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        shell: bash
        run: |
          set -euo pipefail
          dist_tag="$(./node_modules/.bin/tsx scripts/resolve-release-channel.ts "$PACKAGE_VERSION" "$RELEASE_CHANNEL")"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Require An Unpublished Version
        shell: bash
        run: |
          package_name='${{ steps.package_meta.outputs.name }}'
          package_version='${{ steps.package_meta.outputs.version }}'
          if npm view "$package_name@$package_version" version > /dev/null 2>&1; then
            echo "$package_name@$package_version is already published." >&2
            exit 1
          fi

      # A create-release request ignores its target when the tag already exists,
      # so an existing tag has to point at this validated commit already. Never
      # move or delete one; a mismatch is a release the owner must resolve.
      - name: Require A Matching Release Tag
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.package_meta.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$PACKAGE_VERSION"

          json_field() {
            node -e 'const [body, field] = process.argv.slice(1); let value; try { value = JSON.parse(body) } catch { process.exit(0) } for (const key of field.split(".")) { value = value?.[key] } if (typeof value === "string") { process.stdout.write(value) }' "$1" "$2"
          }

          lookup_status=0
          reference="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>/dev/null)" || lookup_status=$?

          if [[ "$lookup_status" -ne 0 ]]; then
            # `gh` writes the response body to stdout and exits non-zero for every
            # HTTP error, so a non-empty body does not mean the tag exists and an
            # empty one does not mean it is absent. Only a confirmed 404 may
            # continue; authentication, rate-limit, server, and transport failures
            # have to stop the release rather than be read as absence.
            if [[ "$(json_field "$reference" status)" != '404' ]]; then
              echo "Could not determine whether tag $tag exists: ${reference:-no response}" >&2
              exit 1
            fi
            echo "Tag $tag does not exist yet; it will be created at $GITHUB_SHA."
            exit 0
          fi

          object_sha="$(json_field "$reference" object.sha)"
          if [[ -z "$object_sha" ]]; then
            echo "Unexpected reference payload for tag $tag: ${reference:-no response}" >&2
            exit 1
          fi

          if [[ "$(json_field "$reference" object.type)" == 'tag' ]]; then
            annotated_status=0
            annotated="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" 2>/dev/null)" || annotated_status=$?
            object_sha="$(json_field "$annotated" object.sha)"
            if [[ "$annotated_status" -ne 0 || -z "$object_sha" ]]; then
              echo "Could not resolve annotated tag $tag to a commit." >&2
              exit 1
            fi
          fi

          if [[ "$object_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag $tag already points at $object_sha, not the validated commit $GITHUB_SHA." >&2
            exit 1
          fi
          echo "Tag $tag already points at the validated commit $GITHUB_SHA."

      - name: Build Release Artifacts
        shell: bash
        run: |
          mkdir release-artifacts
          corepack npm pack --ignore-scripts --allow-directory=all --pack-destination release-artifacts
          corepack npm run sbom -- release-artifacts/sbom.cdx.json
          ./node_modules/.bin/tsx scripts/preview-release-notes.ts > release-artifacts/release-notes.md

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: release-artifacts
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify-and-pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js For Trusted Publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download Release Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      - name: Publish With Provenance
        shell: bash
        run: |
          dist_tag='${{ needs.verify-and-pack.outputs.release_dist_tag }}'
          corepack npm publish ./release-artifacts/*.tgz --allow-file=all --access public --provenance --tag "$dist_tag"

  github-release:
    needs:
      - verify-and-pack
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download Release Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: release-artifacts

      # Without an explicit target the create-release API tags the default
      # branch's current tip, which can have moved past the validated commit
      # while this workflow waited for its protected-environment approval. The
      # tag has to describe the same commit as the published tarball and its
      # provenance.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.verify-and-pack.outputs.package_version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.verify-and-pack.outputs.package_version }}
          body_path: release-artifacts/release-notes.md
          files: |
            release-artifacts/*.tgz
            release-artifacts/sbom.cdx.json
          prerelease: ${{ needs.verify-and-pack.outputs.release_dist_tag == 'next' }}
