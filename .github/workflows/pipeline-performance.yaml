name: Recording Pipeline Performance

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: Baseline commit to compare with the selected candidate ref
        required: true
        default: 0b61d4f8a79be92dd4ffce315d4d2cc9e0a8a798
        type: string

permissions:
  contents: read

concurrency:
  group: pipeline-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  paired-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Candidate And Baseline History
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install Harness Dependencies
        run: corepack npm ci --ignore-scripts

      - name: Check Install Script Approvals
        run: corepack npm run check:install-scripts

      - name: Rebuild Harness Runtime
        run: corepack npm rebuild esbuild

      - name: Build Pinned Measurement Environment
        run: docker build -f scripts/bench/pipeline/Dockerfile -t wdio-video-pipeline:local .

      - name: Run Five Paired Comparisons And Five-Minute Soak
        env:
          BASELINE_REFERENCE: ${{ inputs.baseline }}
        run: corepack npm run bench:pipeline -- --baseline "$BASELINE_REFERENCE" --output tests/results/pipeline/qualification

      - name: Upload Measurements And Environment
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pipeline-performance-${{ github.sha }}
          path: tests/results/pipeline/qualification
          if-no-files-found: error
          retention-days: 30
