name: Post-process Performance

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Install Dependencies Without Scripts
        run: corepack npm ci --ignore-scripts

      - name: Rebuild E2E Binary Dependencies
        run: corepack npm rebuild esbuild ffmpeg-static

      - name: Compare deferred worker counts and global contention
        shell: bash
        run: |
          for worker_count in 1 2; do
            started_at=$(date +%s)
            WDIO_POST_PROCESS_WORKERS="$worker_count" corepack npm run test:e2e:advanced:deferred-merge
            finished_at=$(date +%s)
            elapsed_seconds=$((finished_at - started_at))
            echo "Deferred worker count ${worker_count}: ${elapsed_seconds}s" >> "$GITHUB_STEP_SUMMARY"
          done

          started_at=$(date +%s)
          corepack npm run test:e2e:advanced:global-concurrency
          finished_at=$(date +%s)
          elapsed_seconds=$((finished_at - started_at))
          echo "Global contention: ${elapsed_seconds}s" >> "$GITHUB_STEP_SUMMARY"
